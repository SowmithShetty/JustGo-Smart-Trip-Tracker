<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JustGo — Smart GPS trip tracker with real-time mapping, speed analysis, and contextual insights. Track walks, runs, and drives." />
    <title>JustGo — Smart Trip Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App Styles -->
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/components.css" />
</head>
<body>
    <!-- ── Global Particle Canvas ────────────────────── -->
    <canvas id="bg-canvas" style="
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.45;
    "></canvas>

    <!-- ── Navigation ──────────────────────────────── -->
    <nav id="main-nav" class="nav-bar">
        <div class="nav-brand">
            <div class="nav-logo">
                <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                    <circle cx="15" cy="15" r="13" stroke="url(#logoGrad)" stroke-width="2"/>
                    <path d="M15 5 L15 15 L22 22" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="15" cy="15" r="3" fill="url(#logoGrad)" opacity="0.7"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="30" y2="30">
                            <stop offset="0%"   stop-color="#6C5CE7"/>
                            <stop offset="50%"  stop-color="#A78BFA"/>
                            <stop offset="100%" stop-color="#00F5FF"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <span class="nav-title">JustGo</span>
        </div>
        <div class="nav-links">
            <a href="#/" class="nav-link active" data-page="home" id="nav-home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="#/history" class="nav-link" data-page="history" id="nav-history">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>History</span>
            </a>
            <a href="#/profile" class="nav-link" data-page="profile" id="nav-profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </a>
        </div>
    </nav>

    <!-- ── Main Content ────────────────────────────── -->
    <main id="app-content" class="app-content">
        <!-- Pages render here dynamically -->
    </main>

    <!-- ── Auth Modal ──────────────────────────────── -->
    <div id="auth-modal" class="modal-overlay" style="display:none;">
        <div class="modal glass-card">
            <div class="modal-header">
                <h2 id="auth-modal-title">Welcome to JustGo</h2>
                <p class="text-secondary" style="font-size:0.875rem;">Track your journeys intelligently</p>
            </div>
            <div id="auth-error-banner" class="auth-error-banner" style="display:none;"></div>
            <form id="auth-form" class="auth-form" novalidate>
                <div id="auth-username-group" class="form-group">
                    <label for="auth-username">Username</label>
                    <input type="text" id="auth-username" placeholder="explorer_123" autocomplete="username" />
                    <div class="field-error" id="auth-username-error"></div>
                    <div class="field-hint">3–30 characters · letters, numbers, underscores</div>
                </div>
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" />
                    <div class="field-error" id="auth-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="auth-password" placeholder="••••••••" autocomplete="new-password" />
                        <button type="button" class="password-toggle-btn" id="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <div class="field-error" id="auth-password-error"></div>
                    <!-- Password Strength Meter -->
                    <div class="password-strength" id="password-strength-container" style="display:none;">
                        <div class="strength-bar">
                            <div class="strength-fill" id="password-strength-fill"></div>
                        </div>
                        <span class="strength-label" id="password-strength-label"></span>
                    </div>
                    <div class="field-hint" id="password-requirements">
                        Min 8 chars · letter · number · special character (!@#$…)
                    </div>
                </div>
                <div id="auth-confirm-group" class="form-group">
                    <label for="auth-confirm-password">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="auth-confirm-password" placeholder="••••••••" autocomplete="new-password" />
                        <button type="button" class="password-toggle-btn" id="confirm-password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <div class="field-error" id="auth-confirm-error"></div>
                </div>
                <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-full">
                    Create Account
                </button>
                
                <div class="auth-divider" style="display:flex; align-items:center; margin:var(--space-md) 0; color:var(--text-tertiary); font-size:0.75rem;">
                    <div style="flex:1; height:1px; background:var(--border-color);"></div>
                    <span style="padding:0 var(--space-sm);">OR</span>
                    <div style="flex:1; height:1px; background:var(--border-color);"></div>
                </div>

                <div id="google-signin-btn" style="display:flex; justify-content:center; margin-bottom:var(--space-md);">
                    <!-- Google button will render here -->
                </div>

                <p class="auth-toggle text-secondary">
                    <span id="auth-toggle-text">Already have an account?</span>
                    <a href="#" id="auth-toggle-link">Sign In</a>
                </p>
            </form>
        </div>
    </div>

    <!-- ── Scripts ─────────────────────────────────── -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Global 3D Background -->
    <script type="module" src="/js/background.js"></script>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
