<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JustGo — Smart GPS trip tracker with real-time mapping, speed analysis, and contextual insights. Track walks, runs, and drives." />
    <title>JustGo — Smart Trip Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App Styles -->
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/components.css" />
</head>
<body>
    <!-- ── Global Particle Canvas ────────────────────── -->
    <canvas id="bg-canvas" style="
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.45;
    "></canvas>

    <!-- ── Navigation ──────────────────────────────── -->
    <nav id="main-nav" class="nav-bar">
        <div class="nav-brand">
            <div class="nav-logo">
                <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                    <circle cx="15" cy="15" r="13" stroke="url(#logoGrad)" stroke-width="2"/>
                    <path d="M15 5 L15 15 L22 22" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="15" cy="15" r="3" fill="url(#logoGrad)" opacity="0.7"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="30" y2="30">
                            <stop offset="0%"   stop-color="#6C5CE7"/>
                            <stop offset="50%"  stop-color="#A78BFA"/>
                            <stop offset="100%" stop-color="#00F5FF"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <span class="nav-title">JustGo</span>
        </div>
        <div class="nav-links">
            <a href="#/" class="nav-link active" data-page="home" id="nav-home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="#/history" class="nav-link" data-page="history" id="nav-history">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>History</span>
            </a>
            <a href="#/profile" class="nav-link" data-page="profile" id="nav-profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </a>
        </div>
    </nav>

    <!-- ── Main Content ────────────────────────────── -->
    <main id="app-content" class="app-content">
        <!-- Pages render here dynamically -->
    </main>

    <!-- ── Auth Modal ──────────────────────────────── -->
    <div id="auth-modal" class="modal-overlay" style="display:none;">
        <div class="modal glass-card">
            <div class="modal-header">
                <h2 id="auth-modal-title">Welcome to JustGo</h2>
                <p class="text-secondary" style="font-size:0.875rem;">Track your journeys intelligently</p>
            </div>
            <form id="auth-form" class="auth-form">
                <div id="auth-username-group" class="form-group">
                    <label for="auth-username">Username</label>
                    <input type="text" id="auth-username" placeholder="explorer123" autocomplete="username" />
                </div>
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" />
                </div>
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" />
                </div>
                <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-full">
                    Create Account
                </button>
                <p class="auth-toggle text-secondary">
                    <span id="auth-toggle-text">Already have an account?</span>
                    <a href="#" id="auth-toggle-link">Sign In</a>
                </p>
            </form>
        </div>
    </div>

    <!-- ── Scripts ─────────────────────────────────── -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Global Particle Background -->
    <script>
    (function() {
        const canvas = document.getElementById('bg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let W, H, particles = [];

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function rand(min, max) { return Math.random() * (max - min) + min; }

        function initParticles() {
            particles = [];
            const count = Math.min(80, Math.floor((W * H) / 14000));
            const colors = ['rgba(167,139,250,', 'rgba(0,245,255,', 'rgba(255,45,120,'];
            for (let i = 0; i < count; i++) {
                const c = colors[Math.floor(Math.random() * colors.length)];
                particles.push({
                    x: rand(0, W), y: rand(0, H),
                    vx: rand(-0.2, 0.2), vy: rand(-0.3, -0.05),
                    r: rand(1, 2.5),
                    color: c,
                    alpha: rand(0.2, 0.8),
                    life: rand(0, Math.PI * 2),
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => {
                p.life += 0.015;
                p.alpha = 0.3 + 0.3 * Math.sin(p.life);
                p.x += p.vx; p.y += p.vy;
                if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
                if (p.x < -10) p.x = W + 10;
                if (p.x > W + 10) p.x = -10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color + p.alpha + ')';
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        resize();
        initParticles();
        draw();
        window.addEventListener('resize', () => { resize(); initParticles(); });
    })();
    </script>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
